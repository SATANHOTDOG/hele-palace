left: 50%;

#actionBtn:active {
transform: scale(0.9);

#zoomBtn {

left: 20px;

height: 50px;

@keyframes shake {
  0% { transform: translate(1px, 1px) rotate(0deg); }
  10% { transform: translate(-1px, -2px) rotate(-1deg); }

// --- 裝潢模式滑鼠/觸控定位器 ---
function getGridPos(clientX, clientY) {
    let rect = canvas.getBoundingClientRect();
    let scale = isZoomed ? 2.0 : 1.0;
    let camX = (cat.x + TILE_SIZE/2) * scale - canvas.width / 2;
    let camY = (cat.y + TILE_SIZE/2) * scale - canvas.height / 2;
    let mapCols = getActiveMapLayout()[0].length;
    let mapRows = getActiveMapLayout().length;
    let maxCamX = (mapCols * TILE_SIZE) * scale - canvas.width;
    let maxCamY = (mapRows * TILE_SIZE) * scale - canvas.height;
    camX = Math.max(0, Math.min(maxCamX, camX));
    camY = Math.max(0, Math.min(maxCamY, camY));

    let worldX = (clientX - rect.left + camX) / scale;
    let worldY = (clientY - rect.top + camY) / scale;
    return { c: Math.floor(worldX / TILE_SIZE), r: Math.floor(worldY / TILE_SIZE) };
}

// 統一把裝潢抓取/放置邏輯寫成函數
function handleEditInteraction(clientX, clientY) {
    tryPlayBGM();
    let pos = getGridPos(clientX, clientY);
    let mapLayout = getActiveMapLayout();
    if (pos.r < 0 || pos.r >= mapLayout.length || pos.c < 0 || pos.c >= mapLayout[0].length) return;

    if (heldItem === null) {
        // 【拔起家具】
        let tile = mapLayout[pos.r][pos.c];
        let rootR = pos.r, rootC = pos.c, rootTile = tile;
        
        // 如果點到空氣牆 999，往回找本尊
        if (tile === 999) {
            for (let dr = 0; dr >= -2; dr--) {
                for (let dc = 0; dc >= -2; dc--) {
                    if (pos.r+dr >= 0 && pos.c+dc >= 0) {
                        let t = mapLayout[pos.r+dr][pos.c+dc];
                        if (itemDims[t]) { rootTile = t; rootR = pos.r+dr; rootC = pos.c+dc; }
                    }
                }
            }
        }
        
        // 確定是可移動物品，執行拔除
        if (itemDims[rootTile]) {
            heldItem = rootTile;
            let dim = itemDims[rootTile];
            for (let dr = 0; dr < dim.h; dr++) {
                for (let dc = 0; dc < dim.w; dc++) {
                    mapLayout[rootR + dr][rootC + dc] = 0; // 填平變回地板
                }
            }
        }
    } else {
        // 【放置家具】
        let dim = itemDims[heldItem];
        let valid = true;
        // 檢查預計佔用的格數是否都在界內，且都是空的 (0)
        for (let dr = 0; dr < dim.h; dr++) {
            for (let dc = 0; dc < dim.w; dc++) {
                let r = pos.r + dr;
                let c = pos.c + dc;
                if (r >= mapLayout.length || c >= mapLayout[0].length || mapLayout[r][c] !== 0) {
                    valid = false;
                }
            }
        }
        if (valid) {
            // 種進去並鋪設 999 空氣牆
            for (let dr = 0; dr < dim.h; dr++) {
                for (let dc = 0; dc < dim.w; dc++) {
                    mapLayout[pos.r + dr][pos.c + dc] = (dr === 0 && dc === 0) ? heldItem : 999;
                }
            }
            heldItem = null;
            saveMaps(); // 放置成功，自動儲存！
        } else {
            showDialog("<div style='text-align:center;'>❌ 空間不足或卡到其他東西了！</div>", 1500);
        }
    }
}

window.addEventListener('touchstart', e => {

    if (Math.abs(diffX) > 15 || Math.abs(diffY) > 15) {
        if (Math.abs(diffX) > Math.abs(diffY)) touchDir = diffX > 0 ? 'right' : 'left';

async function fetchInventory() {
    try {
        const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTC18jsseZH3TerLqZMzzkJc1uPjh2IVTktcs4DxiuEmpA_NRAnzKrgzZbV43FQtN8b7-vMlvv1BFGF/pub?gid=0&single=true&output=csv";
        const res = await fetch(url);
        const text = await res.text();
        let result = [];
        let row = [], col = "", quote = false;
        for (let i = 0; i < text.length; i++) {
            let cc = text[i], nc = text[i+1];
            if (cc === '"' && quote && nc === '"') { col += '"'; i++; continue; }
            if (cc === '"') { quote = !quote; continue; }
            if (cc === ',' && !quote) { row.push(col); col = ""; continue; }
            if (cc === '\r' && nc === '\n' && !quote) { row.push(col); result.push(row); row = []; col = ""; i++; continue; }
            if (cc === '\n' && !quote) { row.push(col); result.push(row); row = []; col = ""; continue; }
            col += cc;
        }
        if (col !== "" || text.endsWith(',')) row.push(col);
        if (row.length > 0) result.push(row);
        
        const headers = result[0].map(h => h.trim());
        for (let i = 1; i < result.length; i++) {
            let obj = {};
            headers.forEach((h, idx) => obj[h] = (result[i][idx] || "").trim());
            inventoryData.push(obj);
        }
    } catch(err) {
        loadingDiv.innerHTML += `<span class="error-msg">⚠️ 無法載入 Google Sheets，請檢查網路。</span>`;
    }
}

function getBestPromoPrice(item) {
    let priceStr = item['促銷售價'] || "";
    let dateStr = item['促銷期間'] || "";
    if (!priceStr) return null;
    if (!priceStr.includes('|')) return parseInt(priceStr) || null; 
    let prices = priceStr.split('|').map(p => parseInt(p.trim()));
    let dates = dateStr.split('|').map(d => d.trim());
    let today = new Date();
    today.setHours(0,0,0,0);
    let validPromos = [];
    for(let i = 0; i < prices.length; i++) {
        if(!dates[i] || !dates[i].includes('~')) continue;
        let [startStr, endStr] = dates[i].split('~');
        let start = new Date(startStr.trim());
        let end = new Date(endStr.trim());
        end.setHours(23, 59, 59, 999); 
        if(today >= start && today <= end) {
            validPromos.push({ price: prices[i], days: end - start }); 
        }
    }
    if (validPromos.length === 0) return null;
    validPromos.sort((a, b) => a.days - b.days); 
    return validPromos[0].price;
}

function getActiveMapLayout() {
    if (currentMap === 'temple') return templeMap;
    if (currentMap === 'nightMarket') return nightMarketMap;
    if (currentMap === 'holaStore') return holaStoreMap;
}

function isWalkable(newX, newY) {
    let left = newX + 16, right = newX + TILE_SIZE - 16;
    let top = newY + 32, bottom = newY + TILE_SIZE - 4;
    let mapLayout = getActiveMapLayout();
    if (top < 0 || bottom >= mapLayout.length * TILE_SIZE || left < 0 || right >= mapLayout[0].length * TILE_SIZE) return false;

    let c1 = mapLayout[Math.floor(top/TILE_SIZE)][Math.floor(left/TILE_SIZE)];
    let c2 = mapLayout[Math.floor(top/TILE_SIZE)][Math.floor(right/TILE_SIZE)];
    let c3 = mapLayout[Math.floor(bottom/TILE_SIZE)][Math.floor(left/TILE_SIZE)];
    let c4 = mapLayout[Math.floor(bottom/TILE_SIZE)][Math.floor(right/TILE_SIZE)];

    let checkWalkable = (tile) => {
        if (currentMap === 'holaStore') return tile === 0 || tile === 201;
        return tile === 0 || tile === 3;
    }
    return checkWalkable(c1) && checkWalkable(c2) && checkWalkable(c3) && checkWalkable(c4);
}

let isPrompting = false;
function tryInteract() {
    if (cat.isInteracting || isPrompting) return;

    let cx = cat.x + (TILE_SIZE / 2);
    let cy = cat.y + (TILE_SIZE / 2);
    let mapLayout = getActiveMapLayout();

    let checkOffsets = [
        { x: 0, y: -TILE_SIZE }, { x: 0, y: TILE_SIZE }, { x: -TILE_SIZE, y: 0 }, { x: TILE_SIZE, y: 0 }
    ];

    let foundCoord = null;
    for (let offset of checkOffsets) {
        let targetX = cx + offset.x;
        let targetY = cy + offset.y;
        let c = Math.floor(targetX / TILE_SIZE);
        let r = Math.floor(targetY / TILE_SIZE);

        if (r >= 0 && r < mapLayout.length && c >= 0 && c < mapLayout[0].length) {
            let tile = mapLayout[r][c];
            if ((tile >= 110 && tile <= 120) || tile === 999) {
                foundCoord = { r: r, c: c, tile: tile }; break;
            }
            if ([1, 4, 5, 6, 7, 8, 31, 33, 201].includes(tile) || (tile >= 41 && tile <= 44) || (tile >= 51 && tile <= 52)) {
                if (tile === 1 && !(currentMap === 'temple' && r === 7 && c === 9)) continue; // 只鎖定暗門牆壁
                foundCoord = { r: r, c: c, tile: tile }; break;
            }
        }
    }

    if (!foundCoord) return;
    let tile = foundCoord.tile;

    // 若掃到 999 空氣牆，自動逆推找本體
    if (tile === 999 && currentMap === 'holaStore') {
        for (let dr = 0; dr >= -2; dr--) {
            for (let dc = 0; dc >= -2; dc--) {
                let nr = foundCoord.r + dr, nc = foundCoord.c + dc;
                if (nr >= 0 && nc >= 0) {
                    let nt = mapLayout[nr][nc];
                    if (nt >= 110 && nt <= 120) { tile = nt; break; }
                }
            }
            if (tile !== 999) break;
        }
    }

    if (currentMap === 'temple' && tile === 1) {
        wallKnockCount++;
        if (wallKnockCount < 5) {
            showDialog(`<div style='text-align:center;'>🚪 叩、叩... 牆壁發出空洞的聲音。<br><span style='color:#aaa;font-size:0.8em;'>(已敲擊 ${wallKnockCount}/5 下)</span></div>`, 2000);
        } else {
            wallKnockCount = 0;
            isPrompting = true;
            canvas.classList.add('shake-active');
            setTimeout(() => canvas.classList.remove('shake-active'), 500);
            showDialog("<div style='text-align:center;'>✨ 轟隆隆... 牆壁竟然緩緩打開，露出一個充滿北歐質感的神秘空間！</div>", 3500);
            setTimeout(() => {
                currentMap = 'holaStore';
                cat.x = 9.5 * TILE_SIZE; cat.y = 18 * TILE_SIZE; cat.dir = 'up'; isPrompting = false;
            }, 3500);
        }
        return;
    }

    if (tile === 5) handleFortune();
    if (tile === 6) handleNPC();
    if (tile === 7) handleGolden(); 
    if (tile === 8) handleHairless(); 
    if (tile >= 41 && tile <= 44) handleNightCat('boss' + (tile-40), ['🐱 橘貓老闆 (烤香腸)', '🐱 黑貓老闆 (章魚燒)', '🐱 白貓老闆 (波霸奶茶)', '🐱 賓士貓老闆 (撈金魚)'][tile-41]);
    if (tile >= 51 && tile <= 52) handleNightCat('cus' + (tile-50), ['🐈 顧客 (喝珍奶)', '🐈 顧客 (吃香腸)'][tile-51]);

    if (tile === 31) {
        if (foundCoord.c === 1) showDialog("<div style='text-align:center;'>🛵 機車：<br>「叭～叭～！找死啊！」</div>", 3000);
        else if (foundCoord.c === 8) {
            isPrompting = true;
            canvas.classList.add('shake-active');
            setTimeout(() => canvas.classList.remove('shake-active'), 500);
            showDialog("<div style='text-align:center;'>⚙️ 機車：<br>「卡其庫克庫...（劣質的變形音效）」</div>", 1500);
            setTimeout(() => {
                nightMarketMap[foundCoord.r][foundCoord.c] = 33; 
                showDialog("<div style='text-align:center;'>🤖 大墩店變形金剛：<br>「為您服務。但我現在下班了。」</div>", 4000);
                isPrompting = false;
            }, 1500);
        }
    }
    if (tile === 33) showDialog("<div style='text-align:center;'>🤖 大墩店變形金剛：<br>「為您服務。但我現在下班了。」</div>", 3000);

    if (currentMap === 'holaStore') {
        if (tile === 201) {
            isPrompting = true;
            showDialog("<div style='text-align:center;'>🚪 離開大墩店，回到人間...</div>", 1500);
            setTimeout(() => {
                currentMap = 'temple'; cat.x = 8 * TILE_SIZE; cat.y = 8 * TILE_SIZE; cat.dir = 'left'; isPrompting = false;
            }, 1500);
        } else if (tile >= 110 && tile <= 120) {
            showDialog(`🪑 <b>商品簡介</b><br><br>${furnitureDialogues[tile]}`, 8000);
        }
    }
}

function update() {
    if (cat.isInteracting || isPrompting || isDecorating) return; // 裝潢時貓咪定格
    cat.isMoving = false;
    let dx = 0, dy = 0;

    if (keys['w'] || keys['ArrowUp'] || touchDir === 'up') { dy = -cat.speed; cat.dir = 'up'; cat.isMoving = true; }
    else if (keys['s'] || keys['ArrowDown'] || touchDir === 'down') { dy = cat.speed; cat.dir = 'down'; cat.isMoving = true; }
    else if (keys['a'] || keys['ArrowLeft'] || touchDir === 'left') { dx = -cat.speed; cat.dir = 'left'; cat.isMoving = true; }
    else if (keys['d'] || keys['ArrowRight'] || touchDir === 'right') { dx = cat.speed; cat.dir = 'right'; cat.isMoving = true; }

    if (currentMap === 'temple' && cat.y >= 8.5 * TILE_SIZE && dy > 0 && cat.x >= 3.5 * TILE_SIZE && cat.x <= 5.8 * TILE_SIZE) {
        currentMap = 'nightMarket'; cat.y = 0.5 * TILE_SIZE; cat.isMoving = false; return;
    }
    if (currentMap === 'nightMarket' && cat.y <= 0.5 * TILE_SIZE && dy < 0 && cat.x >= 3.5 * TILE_SIZE && cat.x <= 5.8 * TILE_SIZE) {
        currentMap = 'temple'; cat.y = 8.5 * TILE_SIZE; cat.isMoving = false; return;
    }

    if (dx !== 0 && isWalkable(cat.x + dx, cat.y)) cat.x += dx;
    if (dy !== 0 && isWalkable(cat.x, cat.y + dy)) cat.y += dy;
}

    if (tile === 118) ctx.drawImage(images['lazboy_chair2'], posX - (TILE_SIZE * 0.25), posY - (TILE_SIZE * 0.5), TILE_SIZE * 1.5, TILE_SIZE * 1.5);
    if (tile === 119) ctx.drawImage(images['lazboy_chair3'], posX - (TILE_SIZE * 0.25), posY - (TILE_SIZE * 0.5), TILE_SIZE * 1.5, TILE_SIZE * 1.5);
    if (tile === 120) ctx.drawImage(images['blue_chair'], posX - (TILE_SIZE * 0.25), posY - (TILE_SIZE * 0.5), TILE_SIZE * 1.5, TILE_SIZE * 1.5);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save(); 
    
    let mapLayout = getActiveMapLayout();
    let mapCols = mapLayout[0].length;
    let mapRows = mapLayout.length;
    let scale = isZoomed ? 2.0 : 1.0;
    
    let focusX = cat.x + TILE_SIZE / 2;
    let focusY = cat.y + TILE_SIZE / 2;
    
    let camX = focusX * scale - canvas.width / 2;
    let camY = focusY * scale - canvas.height / 2;
    
    let maxCamX = (mapCols * TILE_SIZE) * scale - canvas.width;
    let maxCamY = (mapRows * TILE_SIZE) * scale - canvas.height;
    
    camX = Math.max(0, Math.min(maxCamX, camX));
    camY = Math.max(0, Math.min(maxCamY, camY));
    
    ctx.translate(-camX, -camY);
    ctx.scale(scale, scale);

    // 畫地板
    let floorImg = images['floor2'];
    if (currentMap === 'nightMarket') floorImg = images['floor_night'];
    if (currentMap === 'holaStore') floorImg = images['floor_hola'];

    for (let r = 0; r < mapLayout.length; r++) {
        for (let c = 0; c < mapLayout[r].length; c++) {
            if (mapLayout[r][c] !== 201) {
                ctx.drawImage(floorImg, c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE, TILE_SIZE);
            }
        }
    }

    // 畫固定物件與家具
    for (let r = 0; r < mapLayout.length; r++) {
        for (let c = 0; c < mapLayout[r].length; c++) {
            let tile = mapLayout[r][c];
            let posX = c * TILE_SIZE;
            let posY = r * TILE_SIZE;
            
            if (tile === 1) ctx.drawImage(images['wall'], posX, posY, TILE_SIZE, TILE_SIZE);
            if (tile === 2) ctx.drawImage(images['wall_lotus'], posX, posY, TILE_SIZE, TILE_SIZE);
            if (tile === 3 && c === 5) ctx.drawImage(images['gate'], posX - (TILE_SIZE * 1.25), posY - (TILE_SIZE * 1.5), TILE_SIZE * 2.5, TILE_SIZE * 2.5);
            if (tile === 30) ctx.drawImage(images['fence'], posX, posY, TILE_SIZE, TILE_SIZE);
            if (tile >= 41 && tile <= 44) ctx.drawImage(images['npc_boss' + (tile-40)], posX, posY, TILE_SIZE, TILE_SIZE);
            if (tile >= 51 && tile <= 52) ctx.drawImage(images['npc_cus' + (tile-50)], posX, posY, TILE_SIZE, TILE_SIZE);
            if (tile === 31) ctx.drawImage(images['scooter'], posX, posY - (TILE_SIZE * 0.5), TILE_SIZE, TILE_SIZE * 1.5);
            if (tile === 32) ctx.drawImage(images['tree'], posX, posY - (TILE_SIZE * 0.5), TILE_SIZE, TILE_SIZE * 1.5);
            if (tile >= 21 && tile <= 24) ctx.drawImage(images['stall_' + (tile-20)], posX, posY, TILE_SIZE * 2, TILE_SIZE * 2);
            if (tile === 33) ctx.drawImage(images['robot'], posX - (TILE_SIZE * 0.5), posY - (TILE_SIZE * 1.0), TILE_SIZE * 2, TILE_SIZE * 2);
            if (tile === 101) ctx.drawImage(images['wall_hola'], posX, posY, TILE_SIZE, TILE_SIZE);

            // 獨立出可移動物件
            if (itemDims[tile]) drawItemTile(tile, posX, posY, ctx);
        }
    }

    // --- 裝潢模式下的「上帝之眼」覆蓋層 ---
    if (isDecorating) {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
        ctx.lineWidth = 2;
        for(let r=0; r<mapRows; r++) {
            for(let c=0; c<mapCols; c++) {
                ctx.strokeRect(c*TILE_SIZE, r*TILE_SIZE, TILE_SIZE, TILE_SIZE);
            }
        }
        
        // 渲染抓在手上的幽靈家具
        if (heldItem) {
            let dim = itemDims[heldItem];
            let valid = true;
            for(let dr=0; dr<dim.h; dr++) {
                for(let dc=0; dc<dim.w; dc++) {
                    let r = cursorR + dr, c = cursorC + dc;
                    if (r >= mapRows || c >= mapCols || mapLayout[r][c] !== 0) valid = false;
                }
            }
            ctx.fillStyle = valid ? 'rgba(0, 255, 0, 0.3)' : 'rgba(255, 0, 0, 0.3)';
            ctx.fillRect(cursorC*TILE_SIZE, cursorR*TILE_SIZE, dim.w*TILE_SIZE, dim.h*TILE_SIZE);
            
            ctx.globalAlpha = 0.7; // 半透明效果
            drawItemTile(heldItem, cursorC*TILE_SIZE, cursorR*TILE_SIZE, ctx);
            ctx.globalAlpha = 1.0;
        }
    }

    // 畫貓咪
    let catImg = images['cat_down_idle'];
    if (cat.isInteracting || isPrompting) {
        catImg = images['cat_sit'];
    } else if (cat.isMoving) {
        if (cat.dir === 'up') catImg = images['cat_up2']; 
        if (cat.dir === 'down') catImg = images['cat_down'];
        if (cat.dir === 'left') catImg = images['cat_left'];
        if (cat.dir === 'right') catImg = images['cat_right'];
    } else {
        if (cat.dir === 'down') catImg = images['cat_down_idle'];
        else if (cat.dir === 'up') catImg = images['cat_up2']; 
        else if (cat.dir === 'left') catImg = images['cat_left'];
        else if (cat.dir === 'right') catImg = images['cat_right'];
    }
    ctx.drawImage(catImg, cat.x, cat.y - 10, TILE_SIZE, TILE_SIZE + 10);
    
    ctx.restore(); 
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

function startGame() {
    gameLoop();
}

init(); 
</script>
