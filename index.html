}

function getItemMeta(tile) {
    if (tile === BLESSING_WALL_TILE) {
        return { tile: 9, name: '萬壽光明燈牆', img: 'blessing_lantern_wall', imgSrc: 'blessing_lantern_wall.png', size: '3×3' };
    }
    if (customItemMeta[tile]) return customItemMeta[tile];
    let ov = builtInOverrides[tile];
    let found = catalogItems.find(i => i.tile === tile);
    let dim = itemDims[tile] || { w: 1, h: 1 };
    if (found) {
        return {
            ...found,
            name: (ov && ov.name) ? ov.name : found.name,
            imgSrc: (ov && ov.imgSrc) ? ov.imgSrc : (found.img + '.png'),
            size: `${dim.w}×${dim.h}`
        };
    }
    return {
        tile,
        name: (ov && ov.name) ? ov.name : `自訂物件 #${tile}`,
        img: (ov && ov.imgKey) ? ov.imgKey : 'icon',
        imgSrc: (ov && ov.imgSrc) ? ov.imgSrc : 'icon.png',
        size: `${dim.w}×${dim.h}`
    };
}

function getTransformConfig(tile) {
    let src = customItemMeta[tile] || builtInOverrides[tile];
    if (!src) return null;
    let clicks = parseInt(src.clicks) || 0;
    let targetId = parseInt(src.transformId);
    if (clicks > 0 && !isNaN(targetId) && targetId !== 0 && targetId !== tile) {
        return { clicks, targetId };
    }
    return null;
}

                    for (let dc = 0; dc < d.w; dc++) {
                        if (dr === 0 && dc === 0) continue;
                        if (r + dr < grid.length && c + dc < grid[0].length && grid[r + dr][c + dc] === 999) {
                            grid[r + dr][c + dc] = OCCUPIED_TILE;
                        }
                    }
                }
            }
        }
    }
}

function loadMaps() {
    let hadSavedHola = false;
    try {
        let savedTemple = localStorage.getItem('templeMap_v3');
        if (savedTemple) { let p = JSON.parse(savedTemple); if(p.length === 20) { templeMap = p; migrateOccupiedCells(templeMap); } }
        let savedNight = localStorage.getItem('nightMarketMap_v3');
        if (savedNight) { let p = JSON.parse(savedNight); if(p.length === 20) { nightMarketMap = p; migrateOccupiedCells(nightMarketMap); } }
        let savedHola = localStorage.getItem('holaStoreMap_v2');
        if (savedHola) { let p = JSON.parse(savedHola); if(p.length === 20) { holaStoreMap = p; migrateOccupiedCells(holaStoreMap); hadSavedHola = true; } }

        let sfTemple = localStorage.getItem('templeFlip_v3');
        if (sfTemple) { let p = JSON.parse(sfTemple); if(p.length === 20) templeFlip = p; }
        let sfNight = localStorage.getItem('nightMarketFlip_v3');
        if (sfNight) { let p = JSON.parse(sfNight); if(p.length === 20) nightMarketFlip = p; }
        let sfHola = localStorage.getItem('holaStoreFlip_v2');
        if (sfHola) { let p = JSON.parse(sfHola); if(p.length === 20) holaStoreFlip = p; }
    } catch(e) {}

    ensureBlessingLanternWall();

    let migrated = localStorage.getItem('holaMigrated_v3');
    if (!hadSavedHola || !migrated) {
        let foundTiles = new Set();
        for(let r=0; r<20; r++) {
            for(let c=0; c<20; c++) {
                let t = holaStoreMap[r][c];
                if ((t >= 41 && t <= 44) || t === 51 || t === 52 || t === 61 || t === 121) foundTiles.add(t);
            }
        }
        const defaultPositions = { 41: [7,5], 42: [8,15], 43: [13,5], 44: [14,15], 51: [16,10], 52: [10,10] };
        for(let id of [41, 42, 43, 44, 51, 52]) {
            if(!foundTiles.has(id)) {
                let [r, c] = defaultPositions[id];
                if(holaStoreMap[r][c] === 0) holaStoreMap[r][c] = id;
                else {
                    outer: for(let rr=1; rr<19; rr++) {
                        for(let cc=1; cc<19; cc++) {
                            if(holaStoreMap[rr][cc] === 0) { holaStoreMap[rr][cc] = id; break outer; }
                        }
                    }
                }
            }
        }
        if (!foundTiles.has(61)) {
            if (holaStoreMap[10][8] === 0) holaStoreMap[10][8] = 61;
            else {
                outerKobe: for(let rr=2; rr<18; rr++) {
                    for(let cc=2; cc<18; cc++) {
                        if(holaStoreMap[rr][cc] === 0) { holaStoreMap[rr][cc] = 61; break outerKobe; }
                    }
                }
            }
        }
        if (!foundTiles.has(121)) {
            const canPlace2x2 = (r, c) => (
                r >= 1 && r + 1 < 19 && c >= 1 && c + 1 < 19 &&
                holaStoreMap[r][c] === 0 && holaStoreMap[r][c+1] === 0 &&
                holaStoreMap[r+1][c] === 0 && holaStoreMap[r+1][c+1] === 0
            );
            if (canPlace2x2(17, 6)) {
                holaStoreMap[17][6] = 121; holaStoreMap[17][7] = OCCUPIED_TILE;
                holaStoreMap[18][6] = OCCUPIED_TILE; holaStoreMap[18][7] = OCCUPIED_TILE;
            } else {
                outerTree: for(let rr=1; rr<18; rr++) {
                    for(let cc=1; cc<18; cc++) {
                        if (canPlace2x2(rr, cc)) {
                            holaStoreMap[rr][cc] = 121; holaStoreMap[rr][cc+1] = OCCUPIED_TILE;
                            holaStoreMap[rr+1][cc] = OCCUPIED_TILE; holaStoreMap[rr+1][cc+1] = OCCUPIED_TILE;
                            break outerTree;
                        }
                    }
                }
            }
        }
        localStorage.setItem('holaMigrated_v3', '1');
        saveMaps();
    }
}
function saveMaps() {
    localStorage.setItem('templeMap_v3', JSON.stringify(templeMap));
    localStorage.setItem('nightMarketMap_v3', JSON.stringify(nightMarketMap));
    localStorage.setItem('holaStoreMap_v2', JSON.stringify(holaStoreMap));

    localStorage.setItem('nightMarketFlip_v3', JSON.stringify(nightMarketFlip));

}

// --- 裝潢代碼分享、清空場地與地圖恢復系統 ---
function encodeGridRLE(grid) {
    let flat = [];
    for (let r = 0; r < grid.length; r++) {
        for (let c = 0; c < grid[r].length; c++) flat.push(grid[r][c]);
    }
    let runs = [];
    let i = 0;
    while (i < flat.length) {
        let val = flat[i];
        let count = 1;
        while (i + count < flat.length && flat[i + count] === val) count++;
        runs.push(count > 1 ? `${val}*${count}` : `${val}`);
        i += count;
    }
    return runs.join(',');
}

function decodeGridRLE(str, rows, cols) {
    if (!str) return null;
    let flat = [];
    let parts = str.split(',');
    for (let p of parts) {
        if (p.includes('*')) {
            let [v, cnt] = p.split('*').map(Number);
            if (isNaN(v) || isNaN(cnt) || cnt <= 0 || cnt > rows * cols) return null;
            for (let k = 0; k < cnt; k++) flat.push(v);
        } else {
            let v = Number(p);
            if (isNaN(v)) return null;
            flat.push(v);
        }
    }
    if (flat.length !== rows * cols) return null;
    let grid = [];
    for (let r = 0; r < rows; r++) {
        grid.push(flat.slice(r * cols, (r + 1) * cols));
    }
    return grid;
}

function generateShareCode() {
    let payload = {
        t: encodeGridRLE(templeMap),
        tf: encodeGridRLE(templeFlip),
        n: encodeGridRLE(nightMarketMap),
        nf: encodeGridRLE(nightMarketFlip),
        h: encodeGridRLE(holaStoreMap),
        hf: encodeGridRLE(holaStoreFlip)
    };
    return 'HELE2:' + btoa(JSON.stringify(payload));
}

function copyShareCode() {
    let area = document.getElementById('exportCodeArea');
    let btn = document.getElementById('copyCodeBtn');
    if (!area) return;
    area.select();
    area.setSelectionRange(0, 99999);
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(area.value).catch(() => document.execCommand('copy'));
    } else {
        document.execCommand('copy');
    }
    if (btn) {
        btn.innerText = "✅ 已複製！可直接貼上到 LINE 分享";
        btn.style.background = "#ffcc00";
    }
}

function applyImportCode() {
    let area = document.getElementById('importCodeArea');
    let msg = document.getElementById('importMsg');
    if (!area) return;
    let raw = area.value.trim();
    let idx = raw.indexOf('HELE2:');
    if (idx === -1) {
        msg.innerText = "❌ 找不到有效的 HELE2: 裝潢代碼格式！";
        return;
    }
    let token = raw.slice(idx + 6).split(/\s+/)[0];
    try {
        let obj = JSON.parse(atob(token));
        let nt = decodeGridRLE(obj.t, 20, 20);
        let ntf = decodeGridRLE(obj.tf, 20, 20);
        let nn = decodeGridRLE(obj.n, 20, 20);
        let nnf = decodeGridRLE(obj.nf, 20, 20);
        let nh = decodeGridRLE(obj.h, 20, 20);
        let nhf = decodeGridRLE(obj.hf, 20, 20);
        if (!nt || !ntf || !nn || !nnf || !nh || !nhf) {
            msg.innerText = "❌ 代碼內容不完整、版本不符或已損毀！";
            return;
        }
        migrateOccupiedCells(nt);
        migrateOccupiedCells(nn);
        migrateOccupiedCells(nh);
        templeMap = nt; templeFlip = ntf;
        nightMarketMap = nn; nightMarketFlip = nnf;
        holaStoreMap = nh; holaStoreFlip = nhf;
        ensureBlessingLanternWall();
        localStorage.setItem('holaMigrated_v3', '1');
        saveMaps();
        showDialog("<div style='text-align:center;'>🎉 <b>裝潢代碼匯入成功！</b><br>已完整還原對方設計的宇宙陣型！</div>", 3000);
    } catch (e) {
        msg.innerText = "❌ 代碼解析失敗，請確認複製時沒有漏字！";
    }
}

function clearConfiguredItems(scope) {
    const keepTiles = new Set([0, 1, 2, 3, 30, 101, 201]);
    const sweepGrid = (grid, flip) => {
        for (let r = 0; r < grid.length; r++) {
            for (let c = 0; c < grid[r].length; c++) {
                if (!keepTiles.has(grid[r][c])) {
                    grid[r][c] = 0;
                    flip[r][c] = 0;
                }
            }
        }
    };

    if (scope === 'current') {
        sweepGrid(getActiveMapLayout(), getActiveFlipLayout());
    } else {
        sweepGrid(templeMap, templeFlip);
        sweepGrid(nightMarketMap, nightMarketFlip);
        sweepGrid(holaStoreMap, holaStoreFlip);
    }

    ensureBlessingLanternWall();
    localStorage.setItem('holaMigrated_v3', '1');
    saveMaps();
    let label = scope === 'current' ? '目前地圖' : '全部三張地圖';
    if (isDecorating) {
        editModeUI.innerText = `🧹 已清空${label}的所有配置商品與 NPC！`;
    }
    showDialog(`<div style='text-align:center;'>🧹 <b>已清空【${label}】所有商品與 NPC！</b><br><span style='font-size:0.88em; color:#ccc;'>外牆、光明燈牆、地板與出入口已保留，現在可以自由從零佈置囉！</span></div>`, 3200);
}

function getGridPos(clientX, clientY) {
    let rect = canvas.getBoundingClientRect();
    let scale = getScale();
    let camX = (cat.x + TILE_SIZE/2) * scale - canvas.width / 2;
    let camY = (cat.y + TILE_SIZE/2) * scale - canvas.height / 2;
    let mapCols = getActiveMapLayout()[0].length;
    let mapRows = getActiveMapLayout().length;
    let maxCamX = (mapCols * TILE_SIZE) * scale - canvas.width;
    let maxCamY = (mapRows * TILE_SIZE) * scale - canvas.height;
    camX = Math.max(0, Math.min(maxCamX, camX));
    camY = Math.max(0, Math.min(maxCamY, camY));

    let canvasAspect = canvas.width / canvas.height;
    let rectAspect = rect.width / rect.height;
    let renderW = rect.width, renderH = rect.height, offsetX = 0, offsetY = 0;
    if (rectAspect > canvasAspect) {
        renderW = rect.height * canvasAspect;
        offsetX = (rect.width - renderW) / 2;
    } else {
        renderH = rect.width / canvasAspect;
        offsetY = (rect.height - renderH) / 2;
    }

    let canvasX = ((clientX - rect.left - offsetX) / renderW) * canvas.width;
    let canvasY = ((clientY - rect.top - offsetY) / renderH) * canvas.height;

    let worldX = (canvasX + camX) / scale;
    let worldY = (canvasY + camY) / scale;
    return { c: Math.floor(worldX / TILE_SIZE), r: Math.floor(worldY / TILE_SIZE) };
}

function getActiveFlipLayout() {
    if (currentMap === 'temple') return templeFlip;
    if (currentMap === 'nightMarket') return nightMarketFlip;
    if (currentMap === 'holaStore') return holaStoreFlip;
}

function isTileWalkableCell(r, c) {
    let mapLayout = getActiveMapLayout();
    if (r < 0 || c < 0 || r >= mapLayout.length || c >= mapLayout[0].length) return false;
    let tile = mapLayout[r][c];
    if (currentMap === 'holaStore') return tile === 0 || tile === 201;
    return tile === 0 || tile === 3;
}

function isSecretWallCell(r, c) {
    return currentMap === 'temple' && (r === 15 || r === 16) && c === 19;
}

function isInteractableCell(r, c) {
    let mapLayout = getActiveMapLayout();
    if (r < 0 || c < 0 || r >= mapLayout.length || c >= mapLayout[0].length) return false;
    let tile = mapLayout[r][c];
    if (tile === 3) return false;
    if (itemDims[tile] || (tile >= 501 && tile !== OCCUPIED_TILE) || tile === OCCUPIED_TILE || tile === 201) return true;
    if (isSecretWallCell(r, c)) return true;
    return false;
}

function findAStarPath(startR, startC, goalSet) {
    let mapLayout = getActiveMapLayout();
    let rows = mapLayout.length, cols = mapLayout[0].length;
    let goalKeys = new Set(goalSet.map(g => `${g.r},${g.c}`));
    if (goalKeys.size === 0) return null;

    let startKey = `${startR},${startC}`;
    if (goalKeys.has(startKey)) return [];

    let open = [{ r: startR, c: startC, g: 0, f: 0 }];
    let cameFrom = {};
    let gScore = { [startKey]: 0 };
    let closed = new Set();

    const heuristic = (r, c) => {
        let best = Infinity;
        for (let g of goalSet) {
            let d = Math.abs(r - g.r) + Math.abs(c - g.c);
            if (d < best) best = d;
        }
        return best;
    };

    const dirs = [{ dr: -1, dc: 0 }, { dr: 1, dc: 0 }, { dr: 0, dc: -1 }, { dr: 0, dc: 1 }];

    while (open.length > 0) {
        open.sort((a, b) => a.f - b.f);
        let curr = open.shift();
        let cKey = `${curr.r},${curr.c}`;
        if (closed.has(cKey)) continue;
        closed.add(cKey);

        if (goalKeys.has(cKey)) {
            let path = [];
            let trace = cKey;
            while (trace && trace !== startKey) {
                let [tr, tc] = trace.split(',').map(Number);
                path.unshift({ r: tr, c: tc });
                trace = cameFrom[trace];
            }
            return path;
        }

        for (let d of dirs) {
            let nr = curr.r + d.dr, nc = curr.c + d.dc;
            if (nr < 0 || nc < 0 || nr >= rows || nc >= cols) continue;
            let nKey = `${nr},${nc}`;
            if (closed.has(nKey)) continue;
            if (!isTileWalkableCell(nr, nc)) continue;

            let tentativeG = curr.g + 1;
            if (gScore[nKey] === undefined || tentativeG < gScore[nKey]) {
                cameFrom[nKey] = cKey;
                gScore[nKey] = tentativeG;
                open.push({ r: nr, c: nc, g: tentativeG, f: tentativeG + heuristic(nr, nc) });
            }
        }
    }
    return null;
}

function getAdjacentGoalsForTarget(r0, c0) {
    let mapLayout = getActiveMapLayout();
    let tile = mapLayout[r0][c0];
    let cells = [{ r: r0, c: c0 }];

    if (tile === OCCUPIED_TILE) {
        outerRoot: for (let dr = 0; dr >= -4; dr--) {
            for (let dc = 0; dc >= -4; dc--) {
                let rr = r0 + dr, cc = c0 + dc;
                if (rr >= 0 && cc >= 0) {
                    let t = mapLayout[rr][cc];
                    let d = itemDims[t];
                    if (d && r0 < rr + d.h && c0 < cc + d.w) {
                        r0 = rr; c0 = cc; tile = t;
                        break outerRoot;
                    }
                }
            }
        }
    }

    if (itemDims[tile] || (tile >= 501 && tile !== OCCUPIED_TILE)) {
        let dim = itemDims[tile] || { w: 1, h: 1 };
        cells = [];
        for (let dr = 0; dr < dim.h; dr++) {
            for (let dc = 0; dc < dim.w; dc++) {
                cells.push({ r: r0 + dr, c: c0 + dc });
            }
        }
    }

    let neighborMap = new Map();
    const dirs = [{ dr: -1, dc: 0 }, { dr: 1, dc: 0 }, { dr: 0, dc: -1 }, { dr: 0, dc: 1 }];
    for (let cell of cells) {
        for (let d of dirs) {
            let nr = cell.r + d.dr, nc = cell.c + d.dc;
            if (isTileWalkableCell(nr, nc)) {
                neighborMap.set(`${nr},${nc}`, { r: nr, c: nc });
            }
        }
    }
    return Array.from(neighborMap.values());
}

function handleMapClickMove(clientX, clientY) {
    if (isDecorating || isPrompting || isBlindBoxOpen) return;
    if (helpModal.style.display === 'flex') return;

    if (dialogBox.style.display === 'block') {
        let posCheck = getGridPos(clientX, clientY);
        if (!(isKnockingWall && isSecretWallCell(posCheck.r, posCheck.c))) {
            closeDialog();
            return;
        }
    }

    tryPlayBGM();
    let pos = getGridPos(clientX, clientY);
    let mapLayout = getActiveMapLayout();
    if (pos.r < 0 || pos.c < 0 || pos.r >= mapLayout.length || pos.c >= mapLayout[0].length) return;

    let startR = Math.floor((cat.y + TILE_SIZE / 2) / TILE_SIZE);
    let startC = Math.floor((cat.x + TILE_SIZE / 2) / TILE_SIZE);

    if (isInteractableCell(pos.r, pos.c) && mapLayout[pos.r][pos.c] !== 201) {
        let goals = getAdjacentGoalsForTarget(pos.r, pos.c);
        let path = findAStarPath(startR, startC, goals);
        if (path !== null) {
            autoPath = path;
            pendingInteractTarget = { r: pos.r, c: pos.c };
            clickMarker = { r: pos.r, c: pos.c, isInteract: true, time: Date.now() };
            if (path.length === 0) {
                faceAndInteractTarget();
            }
        }
        return;
    }

    if (isTileWalkableCell(pos.r, pos.c)) {
        let path = findAStarPath(startR, startC, [{ r: pos.r, c: pos.c }]);
        if (path && path.length > 0) {
            autoPath = path;
            pendingInteractTarget = (mapLayout[pos.r][pos.c] === 201) ? { r: pos.r, c: pos.c } : null;
            clickMarker = { r: pos.r, c: pos.c, isInteract: false, time: Date.now() };
        }
    }
}

function faceAndInteractTarget() {
    if (!pendingInteractTarget) return;
    let target = pendingInteractTarget;
    pendingInteractTarget = null;
    clickMarker = null;

    let catR = Math.floor((cat.y + TILE_SIZE / 2) / TILE_SIZE);
    let catC = Math.floor((cat.x + TILE_SIZE / 2) / TILE_SIZE);
    let dr = target.r - catR;
    let dc = target.c - catC;
    if (Math.abs(dc) >= Math.abs(dr) && dc !== 0) {
        cat.dir = dc > 0 ? 'right' : 'left';
    } else if (dr !== 0) {
        cat.dir = dr > 0 ? 'down' : 'up';
    }
    interactWithCoord(target.r, target.c);
}

function isPlacementValid(r0, c0, dim) {
    let mapLayout = getActiveMapLayout();
    let mapRows = mapLayout.length;
    let mapCols = mapLayout[0].length;
    let catLeft = Math.floor((cat.x + 16) / TILE_SIZE);
    let catRight = Math.floor((cat.x + TILE_SIZE - 16) / TILE_SIZE);
    let catTop = Math.floor((cat.y + 32) / TILE_SIZE);
    let catBottom = Math.floor((cat.y + TILE_SIZE - 4) / TILE_SIZE);

    for (let dr = 0; dr < dim.h; dr++) {
        for (let dc = 0; dc < dim.w; dc++) {
            let r = r0 + dr, c = c0 + dc;
            if (r < 0 || c < 0 || r >= mapRows || c >= mapCols) return false;
            if (mapLayout[r][c] !== 0) return false;
            if (r >= catTop && r <= catBottom && c >= catLeft && c <= catRight) return false;
        }
    }
    return true;
}

function handleEditInteraction(clientX, clientY) {
    if (catalogModal.style.display === 'flex' || dialogBox.style.display === 'block') return;
    tryPlayBGM();
    let pos = getGridPos(clientX, clientY);
    cursorR = pos.r;
    cursorC = pos.c;
    hasHoveredGrid = true;
    let mapLayout = getActiveMapLayout();
    let flipLayout = getActiveFlipLayout();
    if (pos.r < 0 || pos.r >= mapLayout.length || pos.c < 0 || pos.c >= mapLayout[0].length) return;

    if (creativeMode === 'none' || (creativeMode === 'place' && activeSlot < 0)) {
        editModeUI.innerText = "👆 請先點擊下方快捷列物件或「🎒 圖鑑」再點空地放置！";
        return;
    }

    if (creativeMode === 'remove') {
        let tile = mapLayout[pos.r][pos.c];
        let rootR = pos.r, rootC = pos.c, rootTile = tile;
        if (tile === OCCUPIED_TILE) {
            outerFind: for (let dr = 0; dr >= -4; dr--) {
                for (let dc = 0; dc >= -4; dc--) {
                    let rr = pos.r + dr, cc = pos.c + dc;
                    if (rr >= 0 && cc >= 0) {
                        let t = mapLayout[rr][cc];
                        let d = itemDims[t];
                        if (d && pos.r < rr + d.h && pos.c < cc + d.w) {
                            rootTile = t; rootR = rr; rootC = cc;
                            break outerFind;
                        }
                    }
                }
            }
        }
        if ([1, 2, 30, 101, 3, 201, BLESSING_WALL_TILE].includes(rootTile)) {
            editModeUI.innerText = "🔒 外牆、光明燈牆與出入口大門受到結界保護，無法拆除！";
        } else if (itemDims[rootTile] || (rootTile >= 501 && rootTile !== OCCUPIED_TILE)) {
            let dim = itemDims[rootTile] || { w: 1, h: 1 };
            let meta = getItemMeta(rootTile);
            for (let dr = 0; dr < dim.h; dr++) {
                for (let dc = 0; dc < dim.w; dc++) {
                    if (rootR + dr < mapLayout.length && rootC + dc < mapLayout[0].length) {
                        mapLayout[rootR + dr][rootC + dc] = 0;
                        flipLayout[rootR + dr][rootC + dc] = 0;
                    }
                }
            }
            saveMaps();
            editModeUI.innerText = `⛏️ 已收起【${meta.name}】並自動存檔！`;
        } else {
            editModeUI.innerText = "⛏️ 收起模式：請點擊要移除的家具或角色";
        }
    } else {
        let activeTile = hotbarItems[activeSlot];
        let dim = itemDims[activeTile] || { w: 1, h: 1 };
        let meta = getItemMeta(activeTile);
        if (isPlacementValid(pos.r, pos.c, dim)) {
            for (let dr = 0; dr < dim.h; dr++) {
                for (let dc = 0; dc < dim.w; dc++) {
                    let isRoot = (dr === 0 && dc === 0);
                    mapLayout[pos.r + dr][pos.c + dc] = isRoot ? activeTile : OCCUPIED_TILE;
                    flipLayout[pos.r + dr][pos.c + dc] = (isRoot && heldFlipped) ? 1 : 0;
                }
            }
            saveMaps();
            editModeUI.innerText = `✅ 已放置【${meta.name}】！(可繼續連點放置)`;
        } else {
            editModeUI.innerText = "❌ 這裡有牆壁、物件或站著貓咪，換個空位放吧！";
        }
    }
}

function parseCSVText(text) {
    let result = [];
    let row = [], col = "", quote = false;
    for (let i = 0; i < text.length; i++) {
        let cc = text[i], nc = text[i+1];
        if (cc === '"' && quote && nc === '"') { col += '"'; i++; continue; }
        if (cc === '"') { quote = !quote; continue; }
        if (cc === ',' && !quote) { row.push(col); col = ""; continue; }
        if (cc === '\r' && nc === '\n' && !quote) { row.push(col); result.push(row); row = []; col = ""; i++; continue; }
        if (cc === '\n' && !quote) { row.push(col); result.push(row); row = []; col = ""; continue; }
        col += cc;
    }
    if (col !== "" || text.endsWith(',')) row.push(col);
    if (row.length > 0) result.push(row);

    let objects = [];
    if (result.length > 1) {
        const headers = result[0].map(h => h.trim());
        for (let i = 1; i < result.length; i++) {
            let obj = {};
            headers.forEach((h, idx) => obj[h] = (result[i][idx] || "").trim());
            objects.push(obj);
        }
    }
    return objects;
}

// 動態載入 Google 試算表「自訂素材」：支援 A~K 欄（含 Clicks 與 TransformID 外觀切換）
async function fetchCustomItems() {
    let rawUrl = (CUSTOM_SHEET_URL || "").trim();
    if (!rawUrl) {
        customSheetStateText = "未啟用";
        customSheetSettled = true;
        updateLoadUI();
        return;
    }

    let csvUrl = rawUrl.replace('/pubhtml', '/pub');
    if (!csvUrl.includes('output=csv')) {
        csvUrl += (csvUrl.includes('?') ? '&' : '?') + 'output=csv';
    }

    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 5000);
    try {
        const res = await fetch(csvUrl, { signal: controller.signal });
        clearTimeout(timeoutId);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const text = await res.text();
        const rows = parseCSVText(text);
        let loadedCount = 0;

        rows.forEach(rawRow => {
            let row = {};
            Object.keys(rawRow).forEach(k => {
                row[k.trim().toLowerCase()] = rawRow[k];
            });

            let id = parseInt(row['id']);
            if (isNaN(id)) return;

            let rawDialog = (row['dialog'] || "").trim();
            let dialogLines = rawDialog
                ? rawDialog.split('|').map(s => s.trim()).filter(Boolean)
                : [];

            let rawName = (row['name'] || "").trim();
            let rawCat = (row['category'] || "").trim().toLowerCase();
            let rawW = (row['w'] || "").trim();
            let rawH = (row['h'] || "").trim();
            let rawScaleH = (row['scaleh'] || "").trim();
            let lineBtnFlag = ['true', '1', 'yes', '是'].includes((row['linebtn'] || '').toLowerCase());
            let clicksVal = parseInt((row['clicks'] || "").trim()) || 0;
            let transformIdVal = parseInt((row['transformid'] || "").trim());
            if (isNaN(transformIdVal)) transformIdVal = 0;
            let file = (row['file'] || "").trim();

            let imgKey = null;
            let imgSrc = null;
            if (file) {
                if (!/\.[a-zA-Z0-9]+$/.test(file)) file += '.png';
                imgSrc = (file.startsWith('http') || file.startsWith('custom/')) ? file : ('custom/' + file);
                imgKey = 'custom_' + id;
                let imgObj = new Image();
                imgObj.src = imgSrc;
                images[imgKey] = imgObj;
            }

            // 情況 A：修改既有內建物件／人物（ID < 501，如 3~121）
            if (id < 501) {
                let oldDim = itemDims[id] || { w: 1, h: 1 };
                let newW = rawW ? Math.max(1, parseInt(rawW) || 1) : oldDim.w;
                let newH = rawH ? Math.max(1, parseInt(rawH) || 1) : oldDim.h;
                itemDims[id] = { w: newW, h: newH };

                let scaleH = rawScaleH ? (parseFloat(rawScaleH) || 1.0) : null;
                builtInOverrides[id] = {
                    name: rawName || null,
                    imgKey: imgKey,
                    imgSrc: imgSrc,
                    w: rawW ? newW : null,
                    h: rawH ? newH : null,
                    scaleH: scaleH,
                    dialogs: dialogLines,
                    lineBtn: lineBtnFlag,
                    clicks: clicksVal,
                    transformId: transformIdVal,
                    dialogIdx: 0
                };

                let catItem = catalogItems.find(c => c.tile === id);
                if (catItem) {
                    if (rawName) catItem.name = rawName;
                    if (['hola', 'npc', 'props'].includes(rawCat)) catItem.cat = rawCat;
                    if (imgKey) { catItem.img = imgKey; catItem.imgSrc = imgSrc; }
                    catItem.size = `${newW}×${newH}`;
                }
                loadedCount++;
                return;
            }

            // 情況 B：新增全新自訂素材（ID >= 501）
            let name = rawName || `自訂物件 #${id}`;
            let cat = ['hola', 'npc', 'props'].includes(rawCat) ? rawCat : 'hola';
            let w = Math.max(1, parseInt(rawW) || 1);
            let h = Math.max(1, parseInt(rawH) || 1);
            let scaleH = parseFloat(rawScaleH) || 1.0;
            if (!imgSrc) imgSrc = 'icon.png';

            itemDims[id] = { w, h };
            customItemMeta[id] = {
                tile: id,
                cat,
                name,
                img: imgKey || 'icon',
                imgSrc,
                size: `${w}×${h}`,
                scaleH,
                dialogs: dialogLines,
                lineBtn: lineBtnFlag,
                clicks: clicksVal,
                transformId: transformIdVal,
                isCustom: true
            };
            customDialogIndex[id] = 0;
            catalogItems.push(customItemMeta[id]);
            loadedCount++;
        });

        customSheetStateText = `完成(${loadedCount}筆)`;
        if (isDecorating) renderHotbar();
    } catch (err) {
        clearTimeout(timeoutId);
        customSheetStateText = "離線放行";
    } finally {
        customSheetSettled = true;
        updateLoadUI();
    }
}

function getBestPromoPrice(item) {
    let priceStr = item['促銷售價'] || "";
    let dateStr = item['促銷期間'] || "";
    if (!priceStr) return null;
    if (!priceStr.includes('|')) return parseInt(priceStr) || null; 
    let prices = priceStr.split('|').map(p => parseInt(p.trim()));
    let dates = dateStr.split('|').map(d => d.trim());
    let today = new Date();
    today.setHours(0,0,0,0);
    let validPromos = [];
    for(let i = 0; i < prices.length; i++) {
        if(!dates[i] || !dates[i].includes('~')) continue;
        let [startStr, endStr] = dates[i].split('~');
        let start = new Date(startStr.trim());
        let end = new Date(endStr.trim());
        end.setHours(23, 59, 59, 999); 
        if(today >= start && today <= end) {
            validPromos.push({ price: prices[i], days: end - start }); 
        }
    }
    if (validPromos.length === 0) return null;
    validPromos.sort((a, b) => a.days - b.days); 
    return validPromos[0].price;
}

function getActiveMapLayout() {
    if (currentMap === 'temple') return templeMap;

function isWalkable(newX, newY) {
    let left = newX + 16, right = newX + TILE_SIZE - 16;
    let top = newY + 32, bottom = newY + TILE_SIZE - 4;
    let mapLayout = getActiveMapLayout();
    if (top < 0 || bottom >= mapLayout.length * TILE_SIZE || left < 0 || right >= mapLayout[0].length * TILE_SIZE) return false;

    let c1 = mapLayout[Math.floor(top/TILE_SIZE)][Math.floor(left/TILE_SIZE)];
    let c2 = mapLayout[Math.floor(top/TILE_SIZE)][Math.floor(right/TILE_SIZE)];
    let c3 = mapLayout[Math.floor(bottom/TILE_SIZE)][Math.floor(left/TILE_SIZE)];
    let c4 = mapLayout[Math.floor(bottom/TILE_SIZE)][Math.floor(right/TILE_SIZE)];

    let checkWalkable = (tile) => {
        if (currentMap === 'holaStore') return tile === 0 || tile === 201;
        return tile === 0 || tile === 3;
    }
    return checkWalkable(c1) && checkWalkable(c2) && checkWalkable(c3) && checkWalkable(c4);
}

function findSafeTempleExitPos() {
    const candidates = [
        [16, 17], [16, 18], [15, 17], [17, 17], [16, 16], [15, 16], [15, 10], [15, 9]
    ];
    for (let [r, c] of candidates) {
        let t = templeMap[r][c];
        if (t === 0 || t === 3) return { x: c * TILE_SIZE, y: r * TILE_SIZE };
    }
    for (let r = 1; r < 19; r++) {
        for (let c = 1; c < 19; c++) {
            let t = templeMap[r][c];
            if (t === 0 || t === 3) return { x: c * TILE_SIZE, y: r * TILE_SIZE };
        }
    }
    return { x: 9.5 * TILE_SIZE, y: 15 * TILE_SIZE };
}

let isPrompting = false;
function tryInteract() {
    if ((cat.isInteracting && !isKnockingWall) || isPrompting || isDecorating || isBlindBoxOpen) return;
    let cx = cat.x + (TILE_SIZE / 2), cy = cat.y + (TILE_SIZE / 2);
    let mapLayout = getActiveMapLayout();

    const dirMap = {
        up: { x: 0, y: -TILE_SIZE },
        down: { x: 0, y: TILE_SIZE },
        left: { x: -TILE_SIZE, y: 0 },
        right: { x: TILE_SIZE, y: 0 }
    };
    let checkOffsets = [dirMap[cat.dir] || dirMap.up];
    for (let key of ['up', 'down', 'left', 'right']) {
        if (key !== cat.dir) checkOffsets.push(dirMap[key]);
    }

    for (let offset of checkOffsets) {
        let targetX = cx + offset.x, targetY = cy + offset.y;
        let c = Math.floor(targetX / TILE_SIZE), r = Math.floor(targetY / TILE_SIZE);
        if (r >= 0 && r < mapLayout.length && c >= 0 && c < mapLayout[0].length) {
            let tile = mapLayout[r][c];
            if (tile === 3) continue;
            if (itemDims[tile] || (tile >= 501 && tile !== OCCUPIED_TILE) || tile === OCCUPIED_TILE || tile === 1 || tile === 201) {
                if (tile === 1 && !isSecretWallCell(r, c)) continue;
                interactWithCoord(r, c);
                return;
            }
        }
    }
}

// 點擊對話框內的「㊙️切換外觀」按鈕
function handleTransformBtnClick(event) {
    if (event) event.stopPropagation();
    if (!activeTransformState) return;

    activeTransformState.count++;

    if (activeTransformState.count < activeTransformState.required) {
        let btn = document.getElementById('transformActionBtn');
        if (btn) {
            btn.innerText = `㊙️切換外觀 (${activeTransformState.count}/${activeTransformState.required})`;
        }
        if (window.dialogTimeout) {
            clearTimeout(window.dialogTimeout);
            window.dialogTimeout = setTimeout(() => closeDialog(), 8000);
        }
        return;
    }

    let { r: rootR, c: rootC, tile: oldTile, targetId } = activeTransformState;
    let mapLayout = getActiveMapLayout();
    let flipLayout = getActiveFlipLayout();

    if (mapLayout[rootR][rootC] !== oldTile) {
        closeDialog();
        return;
    }

    let oldDim = itemDims[oldTile] || { w: 1, h: 1 };
    let newDim = itemDims[targetId] || { w: 1, h: 1 };
    let mapRows = mapLayout.length;
    let mapCols = mapLayout[0].length;
    let catLeft = Math.floor((cat.x + 16) / TILE_SIZE);
    let catRight = Math.floor((cat.x + TILE_SIZE - 16) / TILE_SIZE);
    let catTop = Math.floor((cat.y + 32) / TILE_SIZE);
    let catBottom = Math.floor((cat.y + TILE_SIZE - 4) / TILE_SIZE);

    let canFit = true;
    for (let dr = 0; dr < newDim.h; dr++) {
        for (let dc = 0; dc < newDim.w; dc++) {
            let rr = rootR + dr, cc = rootC + dc;
            if (rr < 0 || cc < 0 || rr >= mapRows || cc >= mapCols) { canFit = false; break; }
            let isOwnOldCell = (dr < oldDim.h && dc < oldDim.w);
            if (!isOwnOldCell) {
                if (mapLayout[rr][cc] !== 0) { canFit = false; break; }
                if (rr >= catTop && rr <= catBottom && cc >= catLeft && cc <= catRight) { canFit = false; break; }
            }
        }
        if (!canFit) break;
    }

    if (!canFit) {
        activeTransformState.count = 0;
        showDialog("<div style='text-align:center;'>⚠️ <b>空間不足！</b><br>周圍被牆壁、貓咪或其他家具擋住，無法切換外觀。</div>", 2600);
        return;
    }

    let wasFlipped = flipLayout[rootR][rootC] || 0;
    for (let dr = 0; dr < oldDim.h; dr++) {
        for (let dc = 0; dc < oldDim.w; dc++) {
            mapLayout[rootR + dr][rootC + dc] = 0;
            flipLayout[rootR + dr][rootC + dc] = 0;
        }
    }
    for (let dr = 0; dr < newDim.h; dr++) {
        for (let dc = 0; dc < newDim.w; dc++) {
            let isRoot = (dr === 0 && dc === 0);
            mapLayout[rootR + dr][rootC + dc] = isRoot ? targetId : OCCUPIED_TILE;
            flipLayout[rootR + dr][rootC + dc] = (isRoot && wasFlipped) ? 1 : 0;
        }
    }

    saveMaps();
    closeDialog();
    canvas.classList.add('shake-active');
    setTimeout(() => canvas.classList.remove('shake-active'), 500);
}

        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');

async function castBlindBoxLink() {
    let inp = document.getElementById('blindBoxSkuInput');
    let statusEl = document.getElementById('blindBoxStatusMsg');
    if (!inp) return;

    let rawInput = inp.value.trim();
    if (!rawInput) {
        if (statusEl) statusEl.innerText = "請先輸入商品貨號 (SKU) 再求籤喔！";
        inp.focus();
        return;
    }

    // 去除前後空白後，若長度為 8 碼，自動在前方補 0 變成 9 碼
    let sku = normalizeSku9(rawInput);
    inp.value = sku;

    // 若開局時試算表尚未載入完成，這裡即時向《商品全資料》CSV 補抓一次
    if (inventoryData.length === 0) {
        if (statusEl) {
            statusEl.style.color = "#4fc3f7";
            statusEl.innerText = "⏳ 正在連線《商品全資料》資料庫核對貨號...";
        }
        try {
            const res = await fetch(PRODUCT_SHEET_URL);
            if (res.ok) {
                const text = await res.text();
                inventoryData = parseCSVText(text);
                sheetStateText = `完成(${inventoryData.length}筆)`;
            }
        } catch (e) {}
    }

    if (inventoryData.length === 0) {
        if (statusEl) {
            statusEl.style.color = "#ff5252";
            statusEl.innerText = "⚠️ 目前無法連線《商品全資料》資料庫，請確認網路後再試！";
        }
        return;
    }

    // 比對 SKU 欄位是否存在（相容試算表內 8 碼或 9 碼補零格式）
    let matchedItem = inventoryData.find(row => {
        let rowSku = normalizeSku9(row['SKU'] || '');
        return rowSku !== '' && rowSku === sku;
    });

    if (!matchedItem) {
        if (statusEl) {
            statusEl.style.color = "#ff5252";
            statusEl.innerText = "此商品查無福報，請重新輸入正確貨號！";
        }
        inp.focus();
        inp.select();
        return;
    }

    let productName = (matchedItem['商品名稱'] || sku).trim();

    // 1. 取得當天日期 YYYYMMDD（例如 20261116）
    const now = new Date();
    const dateStr = now.getFullYear() +
        String(now.getMonth() + 1).padStart(2, '0') +
        String(now.getDate()).padStart(2, '0');

    // 2. 嚴格使用「SKU|YYYYMMDD」格式進行編碼
    const rawPayload = `${sku}|${dateStr}`;
    const encoded = btoa(encodeURIComponent(rawPayload));
    const blindBoxUrl = `https://satanhotdog.github.io/vip-check/?c=${encoded}`;

    dialogBox.innerHTML = `
        <div class="blindbox-wrap">
            <div class="blindbox-title">🏮 萬壽光明燈 · 盲盒</div>
            <div style="background:rgba(0,230,118,0.12); border:1px solid #00e676; border-radius:8px; padding:10px; font-size:0.9rem; color:#fff; margin-bottom:8px;">
                求籤成功！神明已為您封存【<b style="color:#ffcc00;">${escapeHtml(productName)}</b>】的 60 天專屬盲盒。
            </div>
            <div style="font-size:0.8rem; color:#bbb;">專屬盲盒查詢網址（貨號：${escapeHtml(sku)}）：</div>

function copyBlindBoxUrl() {
    let urlBox = document.getElementById('blindBoxUrlBox');
    let btn = document.getElementById('copyBlindBoxBtn');
    let feedback = document.getElementById('copyBlindBoxFeedback');
    if (!urlBox) return;

    let textToCopy = urlBox.value;
    const onCopied = () => {
        if (btn) {
            btn.innerText = "✅ 已複製！快貼到 LINE 分享，60 天內皆可查詢";
            btn.style.background = "#ffcc00";
        }
        if (feedback) {
            feedback.innerText = "✅ 已複製！快貼到 LINE 分享，60 天內皆可查詢";
        }
    };

    const fallbackCopy = () => {
        urlBox.focus();
        urlBox.select();
        urlBox.setSelectionRange(0, 99999);
        try {
            document.execCommand('copy');
            onCopied();
        } catch (err) {
            if (feedback) {
                feedback.style.color = "#ffcc00";
                feedback.innerText = "請長按上方網址框全選複製即可分享！";
            }
        }
    };

    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(textToCopy).then(onCopied).catch(fallbackCopy);
    } else {
        fallbackCopy();
    }
}

function interactWithCoord(r, c) {

function checkMapTransitions(dy) {
    if (currentMap === 'temple' && cat.y >= 18.5 * TILE_SIZE && dy > 0 && cat.x >= 8 * TILE_SIZE && cat.x <= 11 * TILE_SIZE) {
        cancelAutoPath();
        currentMap = 'nightMarket';
        cat.x = 9.5 * TILE_SIZE;
        cat.y = 0.5 * TILE_SIZE;
        cat.isMoving = false;
        resetZoomForMap();
        return true;
    }
    if (currentMap === 'nightMarket' && cat.y <= 0.5 * TILE_SIZE && dy < 0 && cat.x >= 8 * TILE_SIZE && cat.x <= 11 * TILE_SIZE) {
        cancelAutoPath();
        currentMap = 'temple';
        cat.x = 9.5 * TILE_SIZE;
        cat.y = 18.5 * TILE_SIZE;
        cat.isMoving = false;
        resetZoomForMap();
        return true;
    }
    return false;
}

function update() {
    if (cat.isInteracting || isPrompting || isDecorating || isBlindBoxOpen) return;
    if (helpModal.style.display === 'flex') return;

    cat.isMoving = false;
    let dx = 0, dy = 0;

    if (keys['w'] || keys['ArrowUp'] || touchDir === 'up') { dy = -cat.speed; cat.dir = 'up'; cat.isMoving = true; }
    else if (keys['s'] || keys['ArrowDown'] || touchDir === 'down') { dy = cat.speed; cat.dir = 'down'; cat.isMoving = true; }
    else if (keys['a'] || keys['ArrowLeft'] || touchDir === 'left') { dx = -cat.speed; cat.dir = 'left'; cat.isMoving = true; }
    else if (keys['d'] || keys['ArrowRight'] || touchDir === 'right') { dx = cat.speed; cat.dir = 'right'; cat.isMoving = true; }

    if (dx !== 0 || dy !== 0) {
        cancelAutoPath();
        if (checkMapTransitions(dy)) return;
        if (dx !== 0 && isWalkable(cat.x + dx, cat.y)) cat.x += dx;
        if (dy !== 0 && isWalkable(cat.x, cat.y + dy)) cat.y += dy;
        return;
    }

    if (autoPath.length > 0) {
        let wp = autoPath[0];
        if (!isTileWalkableCell(wp.r, wp.c)) {
            cancelAutoPath();
            return;
        }
        let targetX = wp.c * TILE_SIZE;
        let targetY = wp.r * TILE_SIZE;
        let diffX = targetX - cat.x;
        let diffY = targetY - cat.y;

        if (Math.abs(diffX) <= cat.speed && Math.abs(diffY) <= cat.speed) {
            cat.x = targetX;
            cat.y = targetY;
            autoPath.shift();
            if (autoPath.length === 0) {
                cat.isMoving = false;
                if (pendingInteractTarget) {
                    faceAndInteractTarget();
                } else {
                    clickMarker = null;
                }
            }
        } else {
            cat.isMoving = true;
            if (Math.abs(diffX) > Math.abs(diffY)) {
                let stepX = Math.sign(diffX) * Math.min(cat.speed, Math.abs(diffX));
                cat.dir = stepX > 0 ? 'right' : 'left';
                if (isWalkable(cat.x + stepX, cat.y)) cat.x += stepX;
                else cancelAutoPath();
            } else {
                let stepY = Math.sign(diffY) * Math.min(cat.speed, Math.abs(diffY));
                cat.dir = stepY > 0 ? 'down' : 'up';
                if (checkMapTransitions(stepY)) return;
                if (isWalkable(cat.x, cat.y + stepY)) cat.y += stepY;
                else cancelAutoPath();
            }
        }
    }
}

setInterval(() => {
    if (currentMap !== 'holaStore' || isDecorating || cat.isInteracting || isPrompting) return;

    let catCenterX = cat.x + TILE_SIZE / 2;
    let catCenterY = cat.y + TILE_SIZE / 2;
    let catR = Math.floor(catCenterY / TILE_SIZE);
    let catC = Math.floor(catCenterX / TILE_SIZE);
    let pathSet = new Set(autoPath.map(p => `${p.r},${p.c}`));

    let npcsToMove = [];
    for (let r = 0; r < holaStoreMap.length; r++) {
        for (let c = 0; c < holaStoreMap[0].length; c++) {
            let tile = holaStoreMap[r][c];
            if ((tile >= 41 && tile <= 44) || tile === 51 || tile === 52) {
                npcsToMove.push({ r, c, tile });
            }
        }
    }

    npcsToMove.forEach(npc => {
        let npcCenterX = npc.c * TILE_SIZE + TILE_SIZE / 2;
        let npcCenterY = npc.r * TILE_SIZE + TILE_SIZE / 2;
        if (Math.hypot(npcCenterX - catCenterX, npcCenterY - catCenterY) <= TILE_SIZE * 1.8) return;
        if (Math.random() > 0.5) return;

        let dirs = [{ dr: -1, dc: 0 }, { dr: 1, dc: 0 }, { dr: 0, dc: -1 }, { dr: 0, dc: 1 }];
        let moves = dirs.filter(d => {
            let nr = npc.r + d.dr, nc = npc.c + d.dc;
            if (nr < 0 || nr >= holaStoreMap.length || nc < 0 || nc >= holaStoreMap[0].length) return false;
            if (nr === catR && nc === catC) return false;
            if (pathSet.has(`${nr},${nc}`)) return false;
            return holaStoreMap[nr][nc] === 0;
        });

        if (moves.length > 0) {
            let move = moves[Math.floor(Math.random() * moves.length)];
            let nr = npc.r + move.dr, nc = npc.c + move.dc;
            if (holaStoreMap[nr][nc] === 0) {
                holaStoreMap[npc.r][npc.c] = 0;
                holaStoreMap[nr][nc] = npc.tile;
                holaStoreFlip[nr][nc] = holaStoreFlip[npc.r][npc.c];
                holaStoreFlip[npc.r][npc.c] = 0;
            }
        }
    });
}, 4500);

function drawItemTile(tile, posX, posY, ctx, flipped = false) {
    let tallY = posY - (TILE_SIZE * 0.5);
    let tallH = TILE_SIZE * 1.5;
    let dim = itemDims[tile] || { w: 1, h: 1 };
    let ov = builtInOverrides[tile];

    if (flipped) {
        let pivotX = (tile === 6 && !(ov && ov.imgKey)) ? (posX + TILE_SIZE * 0.405) : (posX + (dim.w * TILE_SIZE) / 2);
        ctx.save();
        ctx.translate(pivotX, 0);
        ctx.scale(-1, 1);
        ctx.translate(-pivotX, 0);
    }

    if (ov && ov.imgKey) {
        let img = images[ov.imgKey];
        let drawW = dim.w * TILE_SIZE;
        let drawH = dim.h * TILE_SIZE * (ov.scaleH || 1.0);
        let drawY = posY + (dim.h * TILE_SIZE) - drawH;
        if (img && img.complete && img.naturalWidth > 0) {
            ctx.drawImage(img, posX, drawY, drawW, drawH);
        }
        if (flipped) ctx.restore();
        return;
    }

    let hasCustomScale = (ov && ov.scaleH && ov.scaleH !== 1.0);
    if (hasCustomScale) {
        let bottomY = posY + dim.h * TILE_SIZE;
        ctx.save();
        ctx.translate(0, bottomY);
        ctx.scale(1, ov.scaleH);
        ctx.translate(0, -bottomY);
    }
    
    if (tile === 4) ctx.drawImage(images['altar'], posX, tallY, TILE_SIZE, tallH);
    if (tile === 5) ctx.drawImage(images['fortune_box'], posX, posY - (TILE_SIZE * 0.3), TILE_SIZE, TILE_SIZE * 1.3);
    if (tile === 6) ctx.drawImage(images['npc_bluecat'], posX - (TILE_SIZE * 0.22), posY - (TILE_SIZE * 0.85), TILE_SIZE * 1.25, TILE_SIZE * 1.85);
    if (tile === 7) ctx.drawImage(images['npc_golden'], posX, tallY, TILE_SIZE, tallH);
    if (tile === 8) ctx.drawImage(images['npc_hairless'], posX, tallY, TILE_SIZE, tallH);
    if (tile === BLESSING_WALL_TILE) {
        let wallImg = images['blessing_lantern_wall'];
        if (wallImg && wallImg.complete && wallImg.naturalWidth > 0) {
            ctx.drawImage(wallImg, posX, posY, TILE_SIZE * 3, TILE_SIZE * 3);
        } else {
            ctx.fillStyle = '#8b1a1a';
            ctx.fillRect(posX, posY, TILE_SIZE * 3, TILE_SIZE * 3);
            ctx.strokeStyle = '#ffcc00';
            ctx.lineWidth = 4;
            ctx.strokeRect(posX + 2, posY + 2, TILE_SIZE * 3 - 4, TILE_SIZE * 3 - 4);
            ctx.fillStyle = '#ffcc00';
            ctx.font = 'bold 16px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('🏮 萬壽光明燈牆', posX + TILE_SIZE * 1.5, posY + TILE_SIZE * 1.5);
        }
    }
    if (tile === 99) ctx.drawImage(images[activeGod], posX - (TILE_SIZE * 0.5), posY - (TILE_SIZE * 1.5), TILE_SIZE * 2, TILE_SIZE * 2.5);

    if (tile >= 21 && tile <= 24) ctx.drawImage(images['stall_' + (tile-20)], posX, posY, TILE_SIZE * 2, TILE_SIZE * 2);
    if (tile === 31) ctx.drawImage(images['scooter'], posX, tallY, TILE_SIZE, tallH);
    if (tile === 32) ctx.drawImage(images['tree'], posX, tallY, TILE_SIZE, tallH);
    if (tile === 33) ctx.drawImage(images['robot'], posX - (TILE_SIZE * 0.5), posY - (TILE_SIZE * 1.0), TILE_SIZE * 2, TILE_SIZE * 2);
    
    if (tile >= 41 && tile <= 44) ctx.drawImage(images['npc_boss' + (tile-40)], posX, posY, TILE_SIZE, TILE_SIZE);
    if (tile >= 51 && tile <= 52) ctx.drawImage(images['npc_cus' + (tile-50)], posX, posY, TILE_SIZE, TILE_SIZE);
    if (tile === 61) ctx.drawImage(images['Kobe'], posX - (TILE_SIZE * 0.125), posY - (TILE_SIZE * 0.85), TILE_SIZE * 1.25, TILE_SIZE * 1.85);

    if (tile === 110) ctx.drawImage(images['hola_bed2'], posX, posY - (TILE_SIZE * 0.5), TILE_SIZE * 2, TILE_SIZE * 2.5);
    if (tile === 111) ctx.drawImage(images['hola_bed3'], posX, posY - (TILE_SIZE * 0.5), TILE_SIZE * 2, TILE_SIZE * 2.5);
    if (tile === 112) ctx.drawImage(images['matchy_sofa2'], posX - (TILE_SIZE * 0.05), posY + (TILE_SIZE * 0.7), TILE_SIZE * 3.1, TILE_SIZE * 1.3); 
    if (tile === 113) ctx.drawImage(images['matchy_sofa3'], posX, posY - (TILE_SIZE * 0.5), TILE_SIZE * 2, TILE_SIZE * 2); 
    if (tile === 114) ctx.drawImage(images['dining_table'], posX - 10, posY - (TILE_SIZE * 0.5), TILE_SIZE * 2.2, TILE_SIZE * 2.2);
    if (tile === 115) ctx.drawImage(images['wooden_cabinet2'], posX, posY - (TILE_SIZE * 0.5), TILE_SIZE * 2, TILE_SIZE * 1.5);
    if (tile === 116) ctx.drawImage(images['wooden_cabinet3'], posX + (TILE_SIZE * 0.1), posY - (TILE_SIZE * 0.5), TILE_SIZE * 1.8, TILE_SIZE * 2.5); 
    if (tile === 117) ctx.drawImage(images['lazboy_chair'], posX - (TILE_SIZE * 0.25), posY - (TILE_SIZE * 0.5), TILE_SIZE * 1.5, TILE_SIZE * 1.5);
    if (tile === 118) ctx.drawImage(images['lazboy_chair2'], posX - (TILE_SIZE * 0.25), posY - (TILE_SIZE * 0.5), TILE_SIZE * 1.5, TILE_SIZE * 1.5);
    if (tile === 119) ctx.drawImage(images['lazboy_chair3'], posX - (TILE_SIZE * 0.25), posY - (TILE_SIZE * 0.5), TILE_SIZE * 1.5, TILE_SIZE * 1.5);
    if (tile === 120) ctx.drawImage(images['blue_chair'], posX - (TILE_SIZE * 0.25), posY - (TILE_SIZE * 0.5), TILE_SIZE * 1.5, TILE_SIZE * 1.5);
    if (tile === 121) ctx.drawImage(images['xmas_tree'], posX, posY - (TILE_SIZE * 1.2), TILE_SIZE * 2, TILE_SIZE * 3.2);

    if (hasCustomScale) {
        ctx.restore();
    }

    if (customItemMeta[tile] || (tile >= 501 && tile !== OCCUPIED_TILE)) {
        let meta = customItemMeta[tile] || { img: '', scaleH: 1.0 };
        let img = images[meta.img];
        let drawW = dim.w * TILE_SIZE;
        let drawH = dim.h * TILE_SIZE * (meta.scaleH || 1.0);
        let drawY = posY + (dim.h * TILE_SIZE) - drawH;
        if (img && img.complete && img.naturalWidth > 0) {
            ctx.drawImage(img, posX, drawY, drawW, drawH);
        } else {
            ctx.fillStyle = 'rgba(0, 230, 118, 0.28)';
            ctx.fillRect(posX + 4, posY + 4, drawW - 8, dim.h * TILE_SIZE - 8);
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 13px monospace';
            ctx.textAlign = 'center';
            ctx.fillText(`#${tile}`, posX + drawW / 2, posY + (dim.h * TILE_SIZE) / 2 + 5);
        }
    }

    if (flipped) {
        ctx.restore();
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save(); 
    
    let mapLayout = getActiveMapLayout();
    let flipLayout = getActiveFlipLayout();
    let mapCols = mapLayout[0].length;
    let mapRows = mapLayout.length;
    let scale = getScale(); 
    
    let focusX = cat.x + TILE_SIZE / 2;
    let focusY = cat.y + TILE_SIZE / 2;
    
    let camX = focusX * scale - canvas.width / 2;
    let camY = focusY * scale - canvas.height / 2;
    
    let maxCamX = (mapCols * TILE_SIZE) * scale - canvas.width;
    let maxCamY = (mapRows * TILE_SIZE) * scale - canvas.height;
    
    camX = Math.max(0, Math.min(maxCamX, camX));
    camY = Math.max(0, Math.min(maxCamY, camY));
    
    ctx.translate(-camX, -camY);
    ctx.scale(scale, scale);

    let floorImg = images['floor2'];
    if (currentMap === 'nightMarket') floorImg = images['floor_night'];
    if (currentMap === 'holaStore') floorImg = images['floor_hola'];

    for (let r = 0; r < mapLayout.length; r++) {
        for (let c = 0; c < mapLayout[r].length; c++) {
            if (mapLayout[r][c] !== 201) {
                ctx.drawImage(floorImg, c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE, TILE_SIZE);
            }
        }
    }

    if (!isDecorating && clickMarker && autoPath.length > 0) {
        let pulse = 0.55 + 0.35 * Math.sin(Date.now() / 160);
        let mx = clickMarker.c * TILE_SIZE + TILE_SIZE / 2;
        let my = clickMarker.r * TILE_SIZE + TILE_SIZE / 2;
        ctx.save();
        ctx.strokeStyle = clickMarker.isInteract ? `rgba(79, 195, 247, ${pulse})` : `rgba(255, 204, 0, ${pulse})`;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(mx, my, TILE_SIZE * 0.34, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
    }

    for (let r = 0; r < mapLayout.length; r++) {
        for (let c = 0; c < mapLayout[r].length; c++) {
            let tile = mapLayout[r][c];
            let posX = c * TILE_SIZE;
            let posY = r * TILE_SIZE;
            
            if (tile === 1) ctx.drawImage(images['wall'], posX, posY, TILE_SIZE, TILE_SIZE);
            if (tile === 2) ctx.drawImage(images['wall_lotus'], posX, posY, TILE_SIZE, TILE_SIZE);
            if (tile === 3 && c === 9) {
                let ov3 = builtInOverrides[3];
                let gw = (ov3 && ov3.w ? ov3.w : 2) * TILE_SIZE;
                let gh = TILE_SIZE * 2.2 * (ov3 && ov3.scaleH ? ov3.scaleH : 1);
                let gImg = (ov3 && ov3.imgKey && images[ov3.imgKey]) ? images[ov3.imgKey] : images['gate'];
                ctx.drawImage(gImg, posX, posY + TILE_SIZE - gh, gw, gh);
            }
            if (tile === 30) ctx.drawImage(images['fence'], posX, posY, TILE_SIZE, TILE_SIZE);
            if (tile === 101) ctx.drawImage(images['wall_hola'], posX, posY, TILE_SIZE, TILE_SIZE);

            if (tile !== 3 && tile !== OCCUPIED_TILE && (itemDims[tile] || tile >= 501)) {
                drawItemTile(tile, posX, posY, ctx, flipLayout[r][c] === 1);
            }
        }
    }

    if (isDecorating) {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.22)';
        ctx.lineWidth = 2;
        for(let r=0; r<mapRows; r++) {
            for(let c=0; c<mapCols; c++) {
                ctx.strokeRect(c*TILE_SIZE, r*TILE_SIZE, TILE_SIZE, TILE_SIZE);
            }
        }
        
        if (hasHoveredGrid && creativeMode === 'remove') {
            if (cursorR >= 0 && cursorR < mapRows && cursorC >= 0 && cursorC < mapCols) {
                ctx.fillStyle = 'rgba(255, 82, 82, 0.35)';
                ctx.fillRect(cursorC * TILE_SIZE, cursorR * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                ctx.strokeStyle = '#ff5252';
                ctx.lineWidth = 3;
                ctx.strokeRect(cursorC * TILE_SIZE, cursorR * TILE_SIZE, TILE_SIZE, TILE_SIZE);
            }
        } else if (hasHoveredGrid && creativeMode === 'place' && activeSlot >= 0) {
            let activeTile = hotbarItems[activeSlot];
            let dim = itemDims[activeTile] || { w: 1, h: 1 };
            let valid = isPlacementValid(cursorR, cursorC, dim);
            ctx.fillStyle = valid ? 'rgba(0, 230, 118, 0.35)' : 'rgba(255, 0, 0, 0.35)';
            ctx.fillRect(cursorC*TILE_SIZE, cursorR*TILE_SIZE, dim.w*TILE_SIZE, dim.h*TILE_SIZE);
            
            ctx.globalAlpha = 0.72;
            drawItemTile(activeTile, cursorC*TILE_SIZE, cursorR*TILE_SIZE, ctx, heldFlipped);
            ctx.globalAlpha = 1.0;
        }
    }

    let catImg = images['cat_down_idle'];
    if (cat.isInteracting || isPrompting) {
        catImg = images['cat_sit'];
    } else if (cat.isMoving) {
        if (cat.dir === 'up') catImg = images['cat_up2']; 
        if (cat.dir === 'down') catImg = images['cat_down'];
        if (cat.dir === 'left') catImg = images['cat_left'];
        if (cat.dir === 'right') catImg = images['cat_right'];
    } else {
        if (cat.dir === 'down') catImg = images['cat_down_idle'];
        else if (cat.dir === 'up') catImg = images['cat_up2']; 
        else if (cat.dir === 'left') catImg = images['cat_left'];
        else if (cat.dir === 'right') catImg = images['cat_right'];
    }
    ctx.drawImage(catImg, cat.x, cat.y - 10, TILE_SIZE, TILE_SIZE + 10);
    
    ctx.restore(); 
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

init(); 
</script>
